<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GEMCOR IVM - Inventory Scanner</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background:#f0f2f5; color:#1a1a2e; overflow-x:hidden; }

  /* === LOADING SCREEN - GETS REMOVED FROM DOM === */
  #loading-screen {
    position: fixed; top:0; left:0; width:100%; height:100%;
    background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 10000; transition: opacity 0.4s ease;
  }
  #loading-screen .logo-pill {
    background: white; padding: 16px 32px; border-radius: 50px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.2); margin-bottom: 24px;
  }
  #loading-screen .logo-pill img { height: 40px; display: block; }
  #loading-screen h1 { color: white; font-size: 22px; margin-bottom: 8px; }
  #loading-screen p { color: rgba(255,255,255,0.8); font-size: 14px; }
  #loading-screen .spinner {
    width: 36px; height: 36px; border: 3px solid rgba(255,255,255,0.3);
    border-top-color: white; border-radius: 50%;
    animation: spin 0.8s linear infinite; margin-top: 20px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* === ERROR BANNER === */
  #error-banner {
    position: fixed; top:0; left:0; width:100%; background:#dc2626; color:white;
    padding: 12px 16px; font-size: 13px; z-index: 9999; display: none;
    text-align: center;
  }

  /* === LOGIN === */
  #login-page {
    min-height: 100vh; display: none;
    background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
    align-items: center; justify-content: center; padding: 20px;
  }
  #login-page.active { display: flex; }
  .login-box {
    background: white; border-radius: 20px; padding: 32px 24px;
    width: 100%; max-width: 360px; box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .login-box .logo-pill {
    background: #1e3a8a; padding: 14px 28px; border-radius: 40px;
    display: inline-block; margin-bottom: 20px;
  }
  .login-box .logo-pill img { height: 32px; display: block; }
  .login-box h2 { font-size: 20px; margin-bottom: 4px; color: #1e3a8a; }
  .login-box .subtitle { color: #6b7280; font-size: 13px; margin-bottom: 24px; }
  .login-box input {
    width: 100%; padding: 14px 16px; border: 1.5px solid #e5e7eb;
    border-radius: 12px; font-size: 15px; margin-bottom: 12px;
    outline: none; transition: border-color 0.2s;
  }
  .login-box input:focus { border-color: #3b82f6; }
  .login-box button {
    width: 100%; padding: 14px; background: #1e3a8a; color: white;
    border: none; border-radius: 12px; font-size: 16px; font-weight: 600;
    cursor: pointer; margin-top: 8px;
  }
  .login-box button:active { transform: scale(0.98); }
  .login-box .error-msg { color: #dc2626; font-size: 13px; margin-top: 10px; display: none; }
  .login-box .offline-badge {
    display: inline-block; background: #f59e0b; color: white;
    font-size: 11px; padding: 3px 10px; border-radius: 20px;
    margin-bottom: 16px; font-weight: 600;
  }

  /* === APP HEADER === */
  #app-header {
    position: fixed; top:0; left:0; width:100%; height: 56px;
    background: #1e3a8a; display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px; z-index: 100; color: white;
  }
  #app-header .header-logo img { height: 28px; }
  #app-header .header-right { display: flex; align-items: center; gap: 12px; }
  #app-header .sync-btn {
    background: rgba(255,255,255,0.15); border: none; color: white;
    padding: 6px 12px; border-radius: 8px; font-size: 12px; cursor: pointer;
  }
  #app-header .user-avatar {
    width: 34px; height: 34px; border-radius: 50%; background: #3b82f6;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 14px; cursor: pointer; border: 2px solid rgba(255,255,255,0.3);
  }
  #user-dropdown {
    position: fixed; top: 56px; right: 12px; background: white;
    border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.15);
    padding: 8px 0; min-width: 180px; display: none; z-index: 200;
  }
  #user-dropdown.show { display: block; }
  #user-dropdown .dd-item { padding: 12px 16px; font-size: 14px; cursor: pointer; color: #374151; }
  #user-dropdown .dd-item:hover { background: #f3f4f6; }
  #user-dropdown .dd-item.logout { color: #dc2626; font-weight: 600; }
  #user-dropdown .dd-divider { height: 1px; background: #e5e7eb; margin: 4px 0; }
  #user-dropdown .dd-user { padding: 12px 16px 4px; font-size: 14px; font-weight: 600; color: #1e3a8a; }
  #user-dropdown .dd-role { padding: 0 16px 8px; font-size: 12px; color: #6b7280; }

  /* === PAGES === */
  .page {
    display: none; padding-top: 56px; padding-bottom: 70px;
    min-height: 100vh;
  }
  .page.active { display: block; }

  /* === SCANNER PAGE === */
  #scanner-page .scanner-box {
    background: white; margin: 16px; border-radius: 16px; padding: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  #scanner-page .scan-input-row {
    display: flex; gap: 10px; margin-bottom: 16px;
  }
  #scanner-page .scan-input-row input {
    flex: 1; padding: 14px 16px; border: 2px solid #e5e7eb;
    border-radius: 12px; font-size: 16px; outline: none;
  }
  #scanner-page .scan-input-row input:focus { border-color: #3b82f6; }
  #scanner-page .scan-input-row button {
    padding: 14px 20px; background: #1e3a8a; color: white;
    border: none; border-radius: 12px; font-size: 14px; font-weight: 600;
    cursor: pointer; white-space: nowrap;
  }
  #scanner-page .cam-btn {
    width: 100%; padding: 16px; background: #10b981; color: white;
    border: none; border-radius: 12px; font-size: 16px; font-weight: 600;
    cursor: pointer; margin-bottom: 16px;
  }
  #scanner-page #camera-view {
    width: 100%; border-radius: 12px; overflow: hidden; margin-bottom: 16px;
    display: none; background: #000;
  }
  #scanner-page .item-result {
    background: #f8fafc; border-radius: 12px; padding: 16px;
    border: 1px solid #e2e8f0; margin-bottom: 16px; display: none;
  }
  #scanner-page .item-result.show { display: block; }
  #scanner-page .item-result h4 { color: #1e3a8a; font-size: 16px; margin-bottom: 4px; }
  #scanner-page .item-result .meta { color: #6b7280; font-size: 13px; margin-bottom: 12px; }
  #scanner-page .item-result .qty-row {
    display: flex; align-items: center; gap: 12px; margin-bottom: 16px;
  }
  #scanner-page .item-result .qty-row label { font-size: 14px; font-weight: 600; color: #374151; }
  #scanner-page .item-result .qty-row input {
    width: 80px; padding: 10px; border: 2px solid #e5e7eb;
    border-radius: 8px; text-align: center; font-size: 16px; font-weight: 600;
  }
  #scanner-page .tx-buttons { display: flex; gap: 10px; }
  #scanner-page .tx-buttons button {
    flex: 1; padding: 14px; border: none; border-radius: 10px;
    font-size: 14px; font-weight: 700; cursor: pointer; color: white;
  }
  #scanner-page .tx-buttons .btn-in { background: #10b981; }
  #scanner-page .tx-buttons .btn-out { background: #ef4444; }
  #scanner-page .tx-buttons .btn-mrs { background: #f59e0b; }

  /* === INVENTORY PAGE === */
  #inventory-page .search-bar {
    padding: 12px 16px; background: white; border-bottom: 1px solid #e5e7eb;
    position: sticky; top: 56px; z-index: 50;
  }
  #inventory-page .search-bar input {
    width: 100%; padding: 12px 16px; border: 1.5px solid #e5e7eb;
    border-radius: 12px; font-size: 14px; outline: none; background: #f9fafb;
  }
  #inventory-page .inv-list { padding: 12px 16px; }
  #inventory-page .inv-card {
    background: white; border-radius: 12px; padding: 14px 16px;
    margin-bottom: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    border-left: 4px solid #3b82f6;
  }
  #inventory-page .inv-card .inv-title { font-weight: 600; font-size: 15px; color: #1e3a8a; margin-bottom: 2px; }
  #inventory-page .inv-card .inv-meta { font-size: 12px; color: #6b7280; }
  #inventory-page .inv-card .inv-qty {
    display: inline-block; margin-top: 8px; padding: 4px 10px;
    border-radius: 6px; font-size: 12px; font-weight: 700;
  }
  #inventory-page .inv-card .inv-qty.ok { background: #d1fae5; color: #065f46; }
  #inventory-page .inv-card .inv-qty.low { background: #fef3c7; color: #92400e; }
  #inventory-page .inv-card .inv-qty.out { background: #fee2e2; color: #991b1b; }
  #inventory-page .empty-state { text-align: center; padding: 60px 20px; color: #9ca3af; }

  /* === HISTORY PAGE === */
  #history-page .hist-list { padding: 12px 16px; }
  #history-page .hist-card {
    background: white; border-radius: 12px; padding: 14px 16px;
    margin-bottom: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    display: flex; justify-content: space-between; align-items: center;
  }
  #history-page .hist-card .hist-left { flex: 1; }
  #history-page .hist-card .hist-title { font-weight: 600; font-size: 14px; color: #1e3a8a; }
  #history-page .hist-card .hist-meta { font-size: 12px; color: #6b7280; margin-top: 2px; }
  #history-page .hist-card .hist-badge {
    padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 700;
    color: white; margin-left: 10px;
  }
  #history-page .hist-card .hist-badge.in { background: #10b981; }
  #history-page .hist-card .hist-badge.out { background: #ef4444; }
  #history-page .hist-card .hist-badge.mrs { background: #f59e0b; }

  /* === BOTTOM NAV === */
  #bottom-nav {
    position: fixed; bottom: 0; left: 0; width: 100%; height: 60px;
    background: white; border-top: 1px solid #e5e7eb;
    display: flex; justify-content: space-around; align-items: center;
    z-index: 100;
  }
  #bottom-nav .nav-item {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; height: 100%; cursor: pointer; color: #9ca3af;
    font-size: 11px; gap: 3px; border: none; background: none;
  }
  #bottom-nav .nav-item svg { width: 22px; height: 22px; }
  #bottom-nav .nav-item.active { color: #1e3a8a; }
  #bottom-nav .nav-item.active svg { fill: #1e3a8a; }

  /* === TOAST === */
  #toast {
    position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
    background: #1e3a8a; color: white; padding: 12px 24px; border-radius: 10px;
    font-size: 14px; font-weight: 500; z-index: 1000; display: none;
    box-shadow: 0 4px 16px rgba(0,0,0,0.2); white-space: nowrap;
  }
  #toast.show { display: block; animation: toastIn 0.3s ease; }
  @keyframes toastIn { from { opacity:0; transform: translateX(-50%) translateY(20px);} to { opacity:1; transform: translateX(-50%) translateY(0);} }

  /* === MODAL === */
  #modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    z-index: 500; display: none; align-items: center; justify-content: center;
    padding: 20px;
  }
  #modal-overlay.show { display: flex; }
  #modal-overlay .modal-box {
    background: white; border-radius: 16px; padding: 24px;
    width: 100%; max-width: 340px; text-align: center;
  }
  #modal-overlay .modal-box h3 { margin-bottom: 8px; color: #1e3a8a; }
  #modal-overlay .modal-box p { color: #6b7280; font-size: 14px; margin-bottom: 20px; }
  #modal-overlay .modal-box .modal-btns { display: flex; gap: 10px; }
  #modal-overlay .modal-box .modal-btns button {
    flex: 1; padding: 12px; border-radius: 10px; border: none;
    font-size: 14px; font-weight: 600; cursor: pointer;
  }
  #modal-overlay .modal-box .modal-btns .btn-cancel { background: #f3f4f6; color: #374151; }
  #modal-overlay .modal-box .modal-btns .btn-confirm { background: #1e3a8a; color: white; }
</style>
<base target="_blank">
</head>
<body>

<!-- ERROR BANNER -->
<div id="error-banner"></div>

<!-- LOADING SCREEN -->
<div id="loading-screen">
  <div class="logo-pill">
    <svg viewBox="0 0 200 40" height="40"><text x="10" y="30" font-family="Arial Black, sans-serif" font-size="28" font-weight="900" fill="#1e3a8a">GEMCOR</text></svg>
  </div>
  <h1>IVM Scanner</h1>
  <p>Inventory & Vehicle Management</p>
  <div class="spinner"></div>
</div>

<!-- LOGIN PAGE -->
<div id="login-page">
  <div class="login-box">
    <center>
      <div class="logo-pill">
        <svg viewBox="0 0 200 40" height="32"><text x="10" y="28" font-family="Arial Black, sans-serif" font-size="26" font-weight="900" fill="white">GEMCOR</text></svg>
      </div>
    </center>
    <h2>Welcome Back</h2>
    <p class="subtitle">Sign in to access inventory</p>
    <div id="offline-tag" class="offline-badge" style="display:none;">OFFLINE MODE</div>
    <input type="text" id="login-user" placeholder="Username" autocomplete="off">
    <input type="password" id="login-pass" placeholder="Password">
    <button onclick="doLogin()">Sign In</button>
    <p id="login-error" class="error-msg">Ask erwin for correct username or password</p>
  </div>
</div>

<!-- APP HEADER -->
<div id="app-header" style="display:none;">
  <div class="header-logo">
    <svg viewBox="0 0 200 40" height="28"><text x="0" y="28" font-family="Arial Black, sans-serif" font-size="24" font-weight="900" fill="white">GEMCOR</text></svg>
  </div>
  <div class="header-right">
    <button class="sync-btn" onclick="syncData()">&#8635; Sync</button>
    <div class="user-avatar" id="header-avatar" onclick="toggleDropdown()">A</div>
  </div>
</div>

<!-- USER DROPDOWN -->
<div id="user-dropdown">
  <div class="dd-user" id="dd-name">User</div>
  <div class="dd-role" id="dd-role">Staff</div>
  <div class="dd-divider"></div>
  <div class="dd-item logout" onclick="doLogout()">&#10148; Sign Out</div>
</div>

<!-- SCANNER PAGE -->
<div id="scanner-page" class="page">
  <div class="scanner-box">
    <button class="cam-btn" id="cam-toggle" onclick="toggleCamera()">&#128247; Start Camera Scan</button>
    <div id="camera-view"></div>
    <div class="scan-input-row">
      <input type="text" id="manual-code" placeholder="Enter QR Code or Inventory ID" autocomplete="off">
      <button onclick="lookupManual()">Lookup</button>
    </div>
    <div class="item-result" id="scan-result">
      <h4 id="res-name">Item Name</h4>
      <div class="meta" id="res-meta">ID: --- | Location: --- | On Hand: 0</div>
      <div class="qty-row">
        <label>Quantity:</label>
        <input type="number" id="tx-qty" value="1" min="1">
      </div>
      <div class="tx-buttons">
        <button class="btn-in" onclick="doTransaction('IN')">&#9650; STOCK IN</button>
        <button class="btn-out" onclick="doTransaction('OUT')">&#9660; STOCK OUT</button>
        <button class="btn-mrs" onclick="doTransaction('MRS')">&#9998; MRS</button>
      </div>
    </div>
  </div>
</div>

<!-- INVENTORY PAGE -->
<div id="inventory-page" class="page">
  <div class="search-bar">
    <input type="text" id="inv-search" placeholder="Search by ID, name, category, location..." oninput="filterInventory()">
  </div>
  <div class="inv-list" id="inv-list">
    <div class="empty-state">Loading inventory...</div>
  </div>
</div>

<!-- HISTORY PAGE -->
<div id="history-page" class="page">
  <div class="hist-list" id="hist-list">
    <div class="empty-state">No transactions yet</div>
  </div>
</div>

<!-- BOTTOM NAV -->
<div id="bottom-nav" style="display:none;">
  <button class="nav-item active" onclick="navTo('scanner')" data-page="scanner">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7v4h4V7H3zm6 0v4h4V7H9zm6 0v4h4V7h-4zM3 13v4h4v-4H3zm6 0v4h4v-4H9zm6 0v4h4v-4h-4z"/></svg>
    Scanner
  </button>
  <button class="nav-item" onclick="navTo('inventory')" data-page="inventory">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
    Inventory
  </button>
  <button class="nav-item" onclick="navTo('history')" data-page="history">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
    History
  </button>
</div>

<!-- TOAST -->
<div id="toast"></div>

<!-- MODAL -->
<div id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal-box">
    <h3 id="modal-title">Confirm</h3>
    <p id="modal-body">Are you sure?</p>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-confirm" id="modal-confirm" onclick="closeModal()">Confirm</button>
    </div>
  </div>
</div>

<script>
// ============================================
// CONFIG - YOUR GOOGLE APPS SCRIPT URL
// ============================================
var GS_URL = 'https://script.google.com/macros/s/AKfycbwxZQPSNFqAmRb9OcHLY-BFEtNxad5QmL3oxiYVenUr-5JnTBuE7FnDVLEQRwundtAY/exec';

// ============================================
// FALLBACK USERS (works even if Sheets is down)
// ============================================
var FALLBACK_USERS = [
  { username: 'Angel', password: 'Aivm123', name: 'IVM Angel' },
  { username: 'Jomar', password: 'Jivm123', name: 'IVM Jomar' },
  { username: 'Marcel', password: 'Mivm123', name: 'IVM Marcel' },
  { username: 'Richel', password: 'Rivm123', name: 'IVM Richel' },
  { username: 'Erwin', password: 'Eivm123', name: 'IVM ERWIN' },
  { username: 'Chay', password: 'Civm123', name: 'IVM CHAY' },
  { username: 'admin', password: 'admin123', name: 'Admin User' }
];

// ============================================
// STATE
// ============================================
var currentUser = null;
var inventoryData = [];
var transactionsData = [];
var sheetUsers = [];
var currentScanItem = null;
var cameraActive = false;
var html5Qrcode = null;

// ============================================
// INIT - THE MOST IMPORTANT PART
// ============================================
function initApp() {
  try {
    // Check if already logged in
    var saved = localStorage.getItem('gemcor_user');
    if (saved) {
      try {
        currentUser = JSON.parse(saved);
        showApp();
        syncData();
      } catch(e) {
        localStorage.removeItem('gemcor_user');
        showLogin();
      }
    } else {
      showLogin();
    }
  } catch(e) {
    showError('Init error: ' + e.message);
    showLogin();
  }
}

// ============================================
// LOADING SCREEN - REMOVE FROM DOM COMPLETELY
// ============================================
function removeLoading() {
  var el = document.getElementById('loading-screen');
  if (el) {
    el.style.opacity = '0';
    setTimeout(function() {
      if (el && el.parentNode) {
        el.parentNode.removeChild(el);
      }
    }, 400);
  }
}

// HARD FAILSAFE: always remove loading after 1.5 seconds
setTimeout(removeLoading, 1500);

// Also start init after a tiny delay so DOM is ready
setTimeout(initApp, 100);

// ============================================
// ERROR HANDLER
// ============================================
window.onerror = function(msg, url, line) {
  showError('JS Error: ' + msg + ' (line ' + line + ')');
  return true;
};

function showError(msg) {
  var banner = document.getElementById('error-banner');
  if (banner) {
    banner.textContent = msg;
    banner.style.display = 'block';
    setTimeout(function() { banner.style.display = 'none'; }, 8000);
  }
}

// ============================================
// LOGIN
// ============================================
function showLogin() {
  removeLoading();
  document.getElementById('login-page').classList.add('active');
  document.getElementById('app-header').style.display = 'none';
  document.getElementById('bottom-nav').style.display = 'none';
  document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
}

function doLogin() {
  var user = document.getElementById('login-user').value.trim();
  var pass = document.getElementById('login-pass').value.trim();
  var errorEl = document.getElementById('login-error');

  if (!user || !pass) {
    errorEl.style.display = 'block';
    errorEl.textContent = 'Please enter username and password';
    return;
  }

  // First try sheet users if loaded
  var matched = null;
  for (var i = 0; i < sheetUsers.length; i++) {
    var u = sheetUsers[i];
    if (u && u.username && u.password &&
        u.username.toLowerCase() === user.toLowerCase() &&
        u.password === pass) {
      matched = u;
      break;
    }
  }

  // Fallback to hardcoded
  if (!matched) {
    for (var j = 0; j < FALLBACK_USERS.length; j++) {
      var f = FALLBACK_USERS[j];
      if (f.username.toLowerCase() === user.toLowerCase() && f.password === pass) {
        matched = f;
        break;
      }
    }
  }

  if (matched) {
    currentUser = matched;
    localStorage.setItem('gemcor_user', JSON.stringify(matched));
    errorEl.style.display = 'none';
    showApp();
    syncData();
  } else {
    errorEl.style.display = 'block';
    errorEl.textContent = 'Ask Erwin for username or password';
  }
}

// Allow Enter key on password field
document.getElementById('login-pass').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') doLogin();
});

// ============================================
// SHOW APP
// ============================================
function showApp() {
  removeLoading();
  document.getElementById('login-page').classList.remove('active');
  document.getElementById('app-header').style.display = 'flex';
  document.getElementById('bottom-nav').style.display = 'flex';

  // Set avatar
  var avatar = document.getElementById('header-avatar');
  var name = currentUser && currentUser.name ? currentUser.name : (currentUser && currentUser.username ? currentUser.username : 'U');
  avatar.textContent = name.charAt(0).toUpperCase();
  document.getElementById('dd-name').textContent = name;
  document.getElementById('dd-role').textContent = currentUser && currentUser.account ? currentUser.account : 'Staff';

  navTo('scanner');
}

// ============================================
// NAVIGATION
// ============================================
function navTo(page) {
  document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
  document.getElementById(page + '-page').classList.add('active');
  document.querySelectorAll('#bottom-nav .nav-item').forEach(function(n) { n.classList.remove('active'); });
  var activeNav = document.querySelector('#bottom-nav .nav-item[data-page="' + page + '"]');
  if (activeNav) activeNav.classList.add('active');

  if (page === 'inventory') renderInventory();
  if (page === 'history') renderHistory();
}

// ============================================
// DROPDOWN & LOGOUT
// ============================================
function toggleDropdown() {
  var dd = document.getElementById('user-dropdown');
  dd.classList.toggle('show');
}

document.addEventListener('click', function(e) {
  var avatar = document.getElementById('header-avatar');
  var dd = document.getElementById('user-dropdown');
  if (avatar && dd && !avatar.contains(e.target) && !dd.contains(e.target)) {
    dd.classList.remove('show');
  }
});

function doLogout() {
  localStorage.removeItem('gemcor_user');
  currentUser = null;
  inventoryData = [];
  transactionsData = [];
  sheetUsers = [];
  document.getElementById('user-dropdown').classList.remove('show');
  showLogin();
  showToast('Signed out successfully');
}

// ============================================
// SYNC DATA FROM GOOGLE SHEETS
// ============================================
function syncData() {
  showToast('Syncing...');

  // Fetch users
  fetchJsonp(GS_URL + '?action=getUsers', function(data) {
    if (data && data.users) {
      sheetUsers = data.users;
    }
  });

  // Fetch inventory
  fetchJsonp(GS_URL + '?action=getInventory', function(data) {
    if (data && data.items) {
      inventoryData = data.items;
      renderInventory();
    }
  });

  // Fetch transactions
  fetchJsonp(GS_URL + '?action=getTransactions', function(data) {
    if (data && data.transactions) {
      transactionsData = data.transactions;
      renderHistory();
    }
  });

  showToast('DAHAN DAHAN PO SA PINDOT!');
}

// ============================================
// JSONP FETCH (avoids CORS issues)
// ============================================
function fetchJsonp(url, callback) {
  var script = document.createElement('script');
  var callbackName = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 10000);

  window[callbackName] = function(data) {
    try { callback(data); } catch(e) {}
    cleanup();
  };

  script.src = url + (url.indexOf('?') > -1 ? '&' : '?') + 'callback=' + callbackName;
  script.onerror = function() {
    cleanup();
  };

  var timeout = setTimeout(function() {
    cleanup();
  }, 10000);

  function cleanup() {
    clearTimeout(timeout);
    if (script.parentNode) script.parentNode.removeChild(script);
    delete window[callbackName];
  }

  document.head.appendChild(script);
}

// ============================================
// INVENTORY RENDER
// ============================================
function renderInventory() {
  var list = document.getElementById('inv-list');
  var search = document.getElementById('inv-search').value.toLowerCase();
  var filtered = inventoryData.filter(function(item) {
    if (!search) return true;
    var s = search;
    return (item.code && item.code.toLowerCase().indexOf(s) > -1) ||
           (item.id && item.id.toLowerCase().indexOf(s) > -1) ||
           (item.name && item.name.toLowerCase().indexOf(s) > -1) ||
           (item.category && item.category.toLowerCase().indexOf(s) > -1) ||
           (item.location && item.location.toLowerCase().indexOf(s) > -1);
  });

  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty-state">No items found</div>';
    return;
  }

  var html = '';
  for (var i = 0; i < filtered.length; i++) {
    var item = filtered[i];
    var qty = parseInt(item.finalOnHand || item.qty || item['final on-hand'] || 0);
    var statusClass = qty <= 0 ? 'out' : (qty <= 5 ? 'low' : 'ok');
    var statusText = qty <= 0 ? 'OUT OF STOCK' : (qty <= 5 ? 'LOW STOCK' : 'IN STOCK');

    html += '<div class="inv-card">' +
      '<div class="inv-title">' + escapeHtml(item.name || item['item description'] || 'Unknown') + '</div>' +
      '<div class="inv-meta">' + escapeHtml(item.id || item['inventory id'] || item.code || '---') + 
      ' &bull; ' + escapeHtml(item.category || '---') + 
      ' &bull; ' + escapeHtml(item.location || '---') + '</div>' +
      '<span class="inv-qty ' + statusClass + '">' + statusText + ': ' + qty + ' ' + escapeHtml(item['base unit'] || 'pcs') + '</span>' +
    '</div>';
  }
  list.innerHTML = html;
}

function filterInventory() {
  renderInventory();
}

// ============================================
// HISTORY RENDER
// ============================================
function renderHistory() {
  var list = document.getElementById('hist-list');
  if (transactionsData.length === 0) {
    list.innerHTML = '<div class="empty-state">No transactions yet</div>';
    return;
  }

  // Sort by date descending
  var sorted = transactionsData.slice().sort(function(a, b) {
    var da = new Date(a.date || 0);
    var db = new Date(b.date || 0);
    return db - da;
  });

  var html = '';
  for (var i = 0; i < sorted.length && i < 50; i++) {
    var t = sorted[i];
    var type = (t.type || '').toUpperCase();
    var badgeClass = type === 'IN' || type === 'STOCK IN' ? 'in' : (type === 'MRS' ? 'mrs' : 'out');
    var shortType = type === 'STOCK IN' ? 'IN' : (type === 'STOCK OUT' ? 'OUT' : type);

    html += '<div class="hist-card">' +
      '<div class="hist-left">' +
        '<div class="hist-title">' + escapeHtml(t['item description'] || t.name || '---') + '</div>' +
        '<div class="hist-meta">' + escapeHtml(t['inventory id'] || t.id || '---') + 
        ' &bull; Qty: ' + (t.qty || 0) + 
        ' &bull; By: ' + escapeHtml(t.user || '---') + '</div>' +
      '</div>' +
      '<span class="hist-badge ' + badgeClass + '">' + escapeHtml(shortType) + '</span>' +
    '</div>';
  }
  list.innerHTML = html;
}

// ============================================
// SCANNER / LOOKUP
// ============================================
function lookupManual() {
  var code = document.getElementById('manual-code').value.trim();
  if (!code) {
    showToast('Please enter a code');
    return;
  }
  lookupItem(code);
}

document.getElementById('manual-code').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') lookupManual();
});

function lookupItem(code) {
  currentScanItem = null;
  document.getElementById('scan-result').classList.remove('show');

  // Search in loaded inventory
  var found = null;
  for (var i = 0; i < inventoryData.length; i++) {
    var item = inventoryData[i];
    var itemCode = item.code || item['qr code'] || item['inventory id'] || '';
    if (itemCode.toLowerCase() === code.toLowerCase()) {
      found = item;
      break;
    }
  }

  if (found) {
    currentScanItem = found;
    var name = found.name || found['item description'] || 'Unknown';
    var id = found.id || found['inventory id'] || found.code || '---';
    var loc = found.location || '---';
    var qty = parseInt(found.finalOnHand || found.qty || found['final on-hand'] || 0);

    document.getElementById('res-name').textContent = name;
    document.getElementById('res-meta').textContent = 'ID: ' + id + ' | Location: ' + loc + ' | On Hand: ' + qty;
    document.getElementById('tx-qty').value = '1';
    document.getElementById('scan-result').classList.add('show');
    showToast('Item found: ' + name);
  } else {
    showToast('Item not found: ' + code);
    // Try fetching from sheet directly
    fetchJsonp(GS_URL + '?action=get-by-code&code=' + encodeURIComponent(code), function(data) {
      if (data && data.item) {
        currentScanItem = data.item;
        var name = data.item.name || data.item['item description'] || 'Unknown';
        var id = data.item.id || data.item['inventory id'] || data.item.code || '---';
        var loc = data.item.location || '---';
        var qty = parseInt(data.item.finalOnHand || data.item.qty || data.item['final on-hand'] || 0);
        document.getElementById('res-name').textContent = name;
        document.getElementById('res-meta').textContent = 'ID: ' + id + ' | Location: ' + loc + ' | On Hand: ' + qty;
        document.getElementById('tx-qty').value = '1';
        document.getElementById('scan-result').classList.add('show');
        showToast('Item found: ' + name);
      }
    });
  }
}

// ============================================
// CAMERA SCANNER
// ============================================
function toggleCamera() {
  var view = document.getElementById('camera-view');
  var btn = document.getElementById('cam-toggle');

  if (cameraActive) {
    stopCamera();
    btn.innerHTML = '&#128247; Start Camera Scan';
    view.style.display = 'none';
    cameraActive = false;
  } else {
    startCamera();
    btn.innerHTML = '&#10060; Stop Camera';
    view.style.display = 'block';
    cameraActive = true;
  }
}

function startCamera() {
  if (typeof Html5Qrcode === 'undefined') {
    // Load library dynamically
    var script = document.createElement('script');
    script.src = 'https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js';
    script.onload = function() {
      initScanner();
    };
    script.onerror = function() {
      showToast('Failed to load scanner library');
      stopCamera();
    };
    document.head.appendChild(script);
  } else {
    initScanner();
  }
}

function initScanner() {
  var view = document.getElementById('camera-view');
  view.innerHTML = '';

  var reader = document.createElement('div');
  reader.id = 'qr-reader';
  reader.style.width = '100%';
  view.appendChild(reader);

  try {
    html5Qrcode = new Html5Qrcode('qr-reader');
    html5Qrcode.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: { width: 250, height: 250 } },
      function(decodedText) {
        document.getElementById('manual-code').value = decodedText;
        lookupItem(decodedText);
        stopCamera();
        document.getElementById('cam-toggle').innerHTML = '&#128247; Start Camera Scan';
        document.getElementById('camera-view').style.display = 'none';
        cameraActive = false;
      },
      function() {}
    ).catch(function(err) {
      showToast('Camera error: ' + err);
      stopCamera();
    });
  } catch(e) {
    showToast('Scanner init failed');
    stopCamera();
  }
}

function stopCamera() {
  if (html5Qrcode) {
    try {
      html5Qrcode.stop().then(function() {
        html5Qrcode.clear();
      }).catch(function() {});
    } catch(e) {}
    html5Qrcode = null;
  }
  document.getElementById('camera-view').innerHTML = '';
}

// ============================================
// TRANSACTIONS (IN / OUT / MRS)
// ============================================
function doTransaction(type) {
  if (!currentScanItem) {
    showToast('No item selected');
    return;
  }

  var qty = parseInt(document.getElementById('tx-qty').value) || 1;
  if (qty < 1) qty = 1;

  var code = currentScanItem.code || currentScanItem['qr code'] || currentScanItem['inventory id'] || '';
  var name = currentScanItem.name || currentScanItem['item description'] || 'Unknown';
  var userName = currentUser && currentUser.name ? currentUser.name : (currentUser && currentUser.username ? currentUser.username : 'User');

  var delta = type === 'IN' ? qty : -qty;
  if (type === 'MRS') delta = -qty; // MRS is also a deduction

  // Build URL
  var url = GS_URL + '?action=transaction' +
    '&code=' + encodeURIComponent(code) +
    '&type=' + encodeURIComponent(type) +
    '&qty=' + qty +
    '&user=' + encodeURIComponent(userName) +
    '&remarks=' + encodeURIComponent('Scanned via IVM app');

  showToast('Processing ' + type + '...');

  fetchJsonp(url, function(data) {
    if (data && data.success) {
      showToast(type + ' successful! ' + name);
      // Add to local history immediately
      transactionsData.unshift({
        date: new Date().toISOString(),
        'inventory id': code,
        'item description': name,
        type: type,
        qty: qty,
        user: userName
      });
      // Refresh inventory
      syncData();
      document.getElementById('scan-result').classList.remove('show');
      document.getElementById('manual-code').value = '';
    } else {
      showToast('Transaction failed: ' + (data && data.error ? data.error : 'Unknown error'));
    }
  });
}

// ============================================
// UTILS
// ============================================
function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function() {
    t.classList.remove('show');
  }, 3000);
}

function escapeHtml(text) {
  if (!text) return '';
  var div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('show');
}

// BACK BUTTON HANDLING
// ============================================
window.addEventListener('popstate', function() {
  // Prevent back button from leaving app
  history.pushState(null, null, location.href);
});
history.pushState(null, null, location.href);
