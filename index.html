<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GEMCOR IVM</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{--primary:#1a56db;--primary-dark:#1e429f;--success:#10b981;--danger:#ef4444;--warning:#f59e0b;--bg:#f3f4f6;--card:#fff;--text:#111827;--text-light:#6b7280;--border:#e5e7eb}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
  .hidden{display:none!important}

  /* Loading Screen */
  #loadingScreen{position:fixed;inset:0;background:linear-gradient(135deg,#1a56db 0%,#1e429f 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .5s}
  #loadingScreen.fade-out{opacity:0;pointer-events:none}
  #loadingScreen img{max-width:280px;width:80%;height:auto;margin-bottom:24px;filter:drop-shadow(0 4px 12px rgba(0,0,0,.3))}
  .loading-spinner{width:40px;height:40px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* Login */
  #loginScreen{position:fixed;inset:0;background:linear-gradient(135deg,#1a56db 0%,#1e429f 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9998;padding:24px}
  #loginScreen img{max-width:300px;width:85%;height:auto;margin-bottom:32px;filter:drop-shadow(0 6px 20px rgba(0,0,0,.25))}
  .login-card{background:var(--card);border-radius:16px;padding:28px;width:100%;max-width:360px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
  .login-card h2{text-align:center;margin-bottom:20px;font-size:1.25rem;color:var(--primary)}
  .input-group{margin-bottom:16px}
  .input-group label{display:block;font-size:.875rem;color:var(--text-light);margin-bottom:6px;font-weight:500}
  .input-group input{width:100%;padding:12px 14px;border:2px solid var(--border);border-radius:10px;font-size:1rem;outline:none;transition:border-color .2s}
  .input-group input:focus{border-color:var(--primary)}
  .btn{width:100%;padding:14px;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;transition:all .2s}
  .btn-primary{background:var(--primary);color:#fff}
  .btn-primary:active{transform:scale(.98);background:var(--primary-dark)}
  .btn-outline{background:transparent;border:2px solid var(--primary);color:var(--primary);margin-top:12px}
  .btn-success{background:var(--success);color:#fff}
  .btn-danger{background:var(--danger);color:#fff}
  .btn-sm{padding:8px 16px;font-size:.875rem;width:auto}

  /* App Header */
  .app-header{position:sticky;top:0;background:var(--primary);color:#fff;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.15);min-height:56px}
  .app-header .logo-section{display:flex;align-items:center;gap:10px}
  .app-header .logo-section img{height:36px;width:auto;filter:drop-shadow(0 2px 4px rgba(0,0,0,.2))}
  .app-header h1{font-size:1.1rem;font-weight:600}
  .app-header .user-info{font-size:.8rem;opacity:.9}

  /* Bottom Nav */
  .bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:8px 0;z-index:100}
  .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;color:var(--text-light);font-size:.7rem;cursor:pointer;transition:color .2s;border:none;background:none}
  .nav-item.active{color:var(--primary);font-weight:600}
  .nav-item svg{width:24px;height:24px;stroke-width:2}

  /* Pages */
  .page{padding:16px;padding-bottom:80px;min-height:calc(100vh - 56px)}
  .page-title{font-size:1.25rem;font-weight:700;margin-bottom:20px;margin-top:4px}

  /* Cards */
  .card{background:var(--card);border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .card-title{font-size:1rem;font-weight:600}
  .badge{font-size:.75rem;padding:4px 10px;border-radius:20px;font-weight:600}
  .badge-blue{background:#dbeafe;color:#1e40af}
  .badge-green{background:#d1fae5;color:#065f46}
  .badge-red{background:#fee2e2;color:#991b1b}
  .badge-orange{background:#ffedd5;color:#9a3412}

  /* Inventory Grid */
  .inventory-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
  .inv-card{background:var(--card);border-radius:12px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.08);cursor:pointer;transition:transform .2s,box-shadow .2s;border-left:4px solid var(--primary)}
  .inv-card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.12)}
  .inv-card-header{display:flex;justify-content:space-between;align-items:start;margin-bottom:10px}
  .inv-card-id{font-size:.8rem;color:var(--text-light);font-family:monospace}
  .inv-card-name{font-size:1rem;font-weight:600;margin-bottom:6px}
  .inv-card-meta{font-size:.8rem;color:var(--text-light);margin-bottom:10px}
  .inv-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;text-align:center}
  .inv-stat{padding:12px 8px;border-radius:10px;background:#f9fafb;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70px}
  .inv-stat-label{font-size:.65rem;color:var(--text-light);text-transform:uppercase;letter-spacing:.5px}
  .inv-stat-value{font-size:.9rem;font-weight:700;margin-top:2px}
  .stat-onhand{color:var(--primary)}
  .stat-in{color:var(--success)}
  .stat-out{color:var(--danger)}
  .stat-mrs{color:var(--warning)}

  /* Search & Filter */
  .search-bar{display:flex;gap:10px;margin-bottom:16px;position:sticky;top:56px;background:var(--bg);padding:16px 0;z-index:50}
  .search-bar input{flex:1;padding:12px 14px;border:2px solid var(--border);border-radius:10px;font-size:.95rem;outline:none}
  .search-bar input:focus{border-color:var(--primary)}
  .filter-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .chip{padding:6px 14px;border-radius:20px;font-size:.8rem;font-weight:500;cursor:pointer;border:2px solid var(--border);background:var(--card);transition:all .2s}
  .chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}

  /* Scan Page */
  .scan-container{display:flex;flex-direction:column;align-items:center;gap:16px}
  #scannerVideo{width:100%;max-width:400px;border-radius:12px;aspect-ratio:4/3;object-fit:cover;background:#000;display:none}
  .scanner-overlay{position:relative;width:100%;max-width:400px;aspect-ratio:4/3;background:#111;border-radius:12px;overflow:hidden;display:none}
  .scanner-frame{position:absolute;inset:15%;border:2px solid rgba(255,255,255,.5);border-radius:8px}
  .scanner-frame::before,.scanner-frame::after{content:'';position:absolute;width:20px;height:20px;border-color:#10b981;border-style:solid}
  .scanner-frame::before{top:-2px;left:-2px;border-width:3px 0 0 3px}
  .scanner-frame::after{bottom:-2px;right:-2px;border-width:0 3px 3px 0}
  .laser-line{position:absolute;left:15%;right:15%;height:2px;background:linear-gradient(90deg,transparent,#10b981,transparent);animation:scan 2s ease-in-out infinite;box-shadow:0 0 8px #10b981}
  @keyframes scan{0%,100%{top:15%;opacity:0}50%{top:85%;opacity:1}}
  .scan-controls{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}

  /* Item Card after scan */
  .item-found-card{background:var(--card);border-radius:16px;padding:20px;width:100%;max-width:400px;box-shadow:0 4px 20px rgba(0,0,0,.15);animation:slideUp .3s ease}
  @keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
  .item-found-header{text-align:center;margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--border)}
  .item-found-header h3{font-size:1.1rem;margin-bottom:4px}
  .item-found-header p{color:var(--text-light);font-size:.85rem}
  .item-found-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;text-align:center;margin-bottom:16px}
  .item-found-stat{padding:8px 4px;border-radius:8px;background:#f9fafb}
  .item-found-stat .label{font-size:.6rem;color:var(--text-light);text-transform:uppercase}
  .item-found-stat .value{font-size:.85rem;font-weight:700}

  /* Transaction Type Selector */
  .tx-type-selector{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
  .tx-type-btn{padding:12px 8px;border:2px solid var(--border);border-radius:10px;background:var(--card);text-align:center;cursor:pointer;transition:all .2s;font-size:.85rem;font-weight:600}
  .tx-type-btn.selected{background:var(--primary);color:#fff;border-color:var(--primary)}
  .tx-type-btn[data-type="in"].selected{background:var(--success);border-color:var(--success)}
  .tx-type-btn[data-type="out"].selected{background:var(--danger);border-color:var(--danger)}
  .tx-type-btn[data-type="mrs"].selected{background:var(--warning);border-color:var(--warning);color:#fff}

  /* Quantity Stepper */
  .qty-stepper{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:16px}
  .qty-stepper button{width:40px;height:40px;border-radius:50%;border:2px solid var(--border);background:var(--card);font-size:1.2rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
  .qty-stepper button:active{background:var(--primary);color:#fff;border-color:var(--primary)}
  .qty-stepper input{width:70px;text-align:center;padding:10px;border:2px solid var(--border);border-radius:10px;font-size:1.1rem;font-weight:700;outline:none}

  /* Toast */
  .toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);background:#1f2937;color:#fff;padding:14px 24px;border-radius:12px;font-size:.9rem;font-weight:500;z-index:9999;transition:transform .3s;box-shadow:0 10px 30px rgba(0,0,0,.2);display:flex;align-items:center;gap:10px}
  .toast.show{transform:translateX(-50%) translateY(0)}
  .toast.success{background:var(--success)}
  .toast.error{background:var(--danger)}

  /* Transactions List */
  .tx-item{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--border)}
  .tx-item:last-child{border-bottom:none}
  .tx-info{flex:1}
  .tx-title{font-size:.9rem;font-weight:600}
  .tx-meta{font-size:.75rem;color:var(--text-light);margin-top:2px}
  .tx-badge{padding:4px 10px;border-radius:20px;font-size:.75rem;font-weight:600}
  .tx-in{background:#d1fae5;color:#065f46}
  .tx-out{background:#fee2e2;color:#991b1b}
  .tx-mrs{background:#ffedd5;color:#9a3412}

  /* Modal */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;opacity:0;pointer-events:none;transition:opacity .2s}
  .modal-overlay.show{opacity:1;pointer-events:auto}
  .modal-content{background:var(--card);border-radius:16px;padding:24px;width:100%;max-width:400px;max-height:85vh;overflow-y:auto;animation:scaleIn .2s ease}
  @keyframes scaleIn{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
  .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
  .modal-header h3{font-size:1.1rem}
  .close-btn{background:none;border:none;font-size:1.5rem;color:var(--text-light);cursor:pointer}

  /* Responsive */
  @media(min-width:768px){.page{padding:24px}.inventory-grid{grid-template-columns:repeat(2,1fr)}}
  @media(min-width:1024px){.inventory-grid{grid-template-columns:repeat(3,1fr)}}
</style>

      <span>History</span>
    </button>
  </nav>
</div>

<!-- Toast -->
<div id="toast" class="toast"><span id="toastIcon">✓</span><span id="toastMsg">Saved!</span></div>

<script>
// ===== CONFIG =====
const CONFIG = {
  api: 'https://script.google.com/macros/s/AKfycbxaz8ZcVTgemCtniaeReELtC1u0juGMB0Sr5_J7-MAJcicn6x-w8c3fomxiNhrp2_dy/exec',
  demoData: [
    {qr:'QR001',id:'GEM-1-1099939-1',name:'Utilux Crimping Lugs 16mm',cat:'COMPONENTS',loc:'WAREHOUSE',onhand:27,in:0,out:0,mrs:0,final:27,unit:'PIECE',cost:45.50},
    {qr:'QR002',id:'GEM-1-1099939-2',name:'Cable Tie 300mm Black',cat:'CONSUMABLES',loc:'PER PROJECT',onhand:150,in:0,out:0,mrs:0,final:150,unit:'PIECE',cost:2.50},
    {qr:'QR003',id:'GEM-1-1099939-3',name:'Digital Multimeter Fluke',cat:'TOOLS',loc:'TOOL ROOM',onhand:5,in:0,out:0,mrs:0,final:5,unit:'SET',cost:8500.00},
    {qr:'QR004',id:'GEM-1-1099939-4',name:'PVC Conduit 25mm',cat:'COMPONENTS',loc:'WAREHOUSE',onhand:200,in:0,out:0,mrs:0,final:200,unit:'ROLL',cost:320.00},
    {qr:'QR005',id:'GEM-1-1099939-5',name:'Safety Helmet Yellow',cat:'EQUIPMENT',loc:'PER PROJECT',onhand:12,in:0,out:0,mrs:0,final:12,unit:'PIECE',cost:450.00},
    {qr:'QR006',id:'GEM-1-1099939-6',name:'Wire Stripper Automatic',cat:'TOOLS',loc:'TOOL ROOM',onhand:8,in:0,out:0,mrs:0,final:8,unit:'PIECE',cost:1200.00},
    {qr:'QR007',id:'GEM-1-1099939-7',name:'Electrical Tape 3M',cat:'CONSUMABLES',loc:'WAREHOUSE',onhand:500,in:0,out:0,mrs:0,final:500,unit:'ROLL',cost:85.00},
    {qr:'QR008',id:'GEM-1-1099939-8',name:'Circuit Breaker 60A',cat:'COMPONENTS',loc:'WAREHOUSE',onhand:35,in:0,out:0,mrs:0,final:35,unit:'PIECE',cost:1250.00}
  ]
};

// ===== STATE =====
let inventory = [];
let transactions = [];
let currentUser = null;
let isDemo = false;
let scanner = null;
let currentItem = null;
let selectedTxType = 'in';
let flashOn = false;

// ===== INIT =====
window.addEventListener('DOMContentLoaded', () => {
  setTimeout(() => {
    document.getElementById('loadingScreen').classList.add('fade-out');
    setTimeout(() => {
      document.getElementById('loadingScreen').classList.add('hidden');
      document.getElementById('loginScreen').classList.remove('hidden');
    }, 500);
  }, 2000);
});

// ===== AUTH =====
function doLogin() {
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value.trim();
  if(!u||!p){showToast('Please enter credentials','error');return}
  currentUser = u;
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('headerUser').textContent = u;
  loadData();
  showToast('Welcome, '+u+'!','success');
}
function demoMode() {
  isDemo = true;
  currentUser = 'Demo User';
  inventory = JSON.parse(JSON.stringify(CONFIG.demoData));
  transactions = [];
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('headerUser').textContent = 'Demo Mode';
  renderInventory();
  renderDashboard();
  renderTransactions();
  showToast('Demo mode activated','success');
}

// ===== DATA =====
async function loadData() {
  try {
    const res = await fetch(CONFIG.api+'?action=getInventory');
    const data = await res.json();
    if(data.success){inventory=data.data;renderInventory();renderDashboard();}
    const txRes = await fetch(CONFIG.api+'?action=getTransactions');
    const txData = await txRes.json();
    if(txData.success){transactions=txData.data;renderTransactions();}
  } catch(e) {
    showToast('Failed to load data','error');
    console.error(e);
  }
}

// ===== NAVIGATION =====
function showPage(name) {
  document.querySelectorAll('.page').forEach(p=>p.classList.add('hidden'));
  document.getElementById('page'+name).classList.remove('hidden');
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  event.currentTarget.classList.add('active');
  if(name==='Inventory') renderInventory();
  if(name==='Transactions') renderTransactions();
  if(name==='Dashboard') renderDashboard();
  if(name!=='Scan') stopScanner();
}

// ===== DASHBOARD =====
function renderDashboard() {
  const total = inventory.length;
  const onhand = inventory.reduce((s,i)=>s+i.onhand,0);
  const inn = inventory.reduce((s,i)=>s+i.in,0);
  const out = inventory.reduce((s,i)=>s+i.out,0);
  const mrs = inventory.reduce((s,i)=>s+i.mrs,0);
  document.getElementById('totalItems').textContent = total+' items';
  document.getElementById('dashTotal').textContent = onhand;
  document.getElementById('dashIn').textContent = inn;
  document.getElementById('dashOut').textContent = out;
  document.getElementById('dashMrs').textContent = mrs;
  document.getElementById('txCount').textContent = transactions.length;
  const recent = transactions.slice(-5).reverse();
  document.getElementById('recentTx').innerHTML = recent.length?recent.map(t=>`
    <div class="tx-item">
      <div class="tx-info">
        <div class="tx-title">${t.item||t.id}</div>
        <div class="tx-meta">${t.date} · ${t.user}</div>
      </div>
      <span class="tx-badge tx-${t.type}">${t.type.toUpperCase()} ${t.qty}</span>
    </div>
  `).join(''):'<p style="color:#9ca3af;text-align:center;padding:12px;">No transactions yet</p>';
}

// ===== INVENTORY =====
let currentCat = 'all';
function setCategory(el) {
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  currentCat = el.dataset.cat;
  renderInventory();
}
function filterInventory() {
  renderInventory();
}
function renderInventory() {
  const search = document.getElementById('invSearch').value.toLowerCase();
  const grid = document.getElementById('inventoryGrid');
  const filtered = inventory.filter(i=>{
    const matchSearch = !search || i.name.toLowerCase().includes(search) || i.id.toLowerCase().includes(search) || i.qr.toLowerCase().includes(search);
    const matchCat = currentCat==='all' || i.cat===currentCat;
    return matchSearch && matchCat;
  });
  grid.innerHTML = filtered.map(i=>`
    <div class="inv-card" onclick="showItemDetail('${i.qr}')">
      <div class="inv-card-header">
        <span class="inv-card-id">${i.id}</span>
        <span class="badge ${i.cat==='COMPONENTS'?'badge-blue':i.cat==='CONSUMABLES'?'badge-green':i.cat==='TOOLS'?'badge-orange':'badge-red'}">${i.cat}</span>
      </div>
      <div class="inv-card-name">${i.name}</div>
      <div class="inv-card-meta">📍 ${i.loc} · ${i.unit}</div>
      <div class="inv-stats">
        <div class="inv-stat"><div class="inv-stat-label">On</div><div class="inv-stat-value stat-onhand">${i.onhand}</div></div>
        <div class="inv-stat"><div class="inv-stat-label">In</div><div class="inv-stat-value stat-in">${i.in}</div></div>
        <div class="inv-stat"><div class="inv-stat-label">Out</div><div class="inv-stat-value stat-out">${i.out}</div></div>
        <div class="inv-stat"><div class="inv-stat-label">MRS</div><div class="inv-stat-value stat-mrs">${i.mrs}</div></div>
      </div>
    </div>
  `).join('');
}
function showItemDetail(qr) {
  const item = inventory.find(i=>i.qr===qr);
  if(!item) return;
  // Simple alert for now - can be enhanced to modal
  showToast(`${item.name} — Final: ${item.final} ${item.unit}`, 'success');
}

// ===== SCANNER =====
function startScanner() {
  const container = document.getElementById('scannerContainer');
  const btnStart = document.getElementById('btnStartScan');
  const btnStop = document.getElementById('btnStopScan');
  const result = document.getElementById('scanResult');

  container.style.display = 'block';
  btnStart.classList.add('hidden');
  btnStop.classList.remove('hidden');
  result.classList.add('hidden');
  result.innerHTML = '';

  scanner = new Html5Qrcode('reader');
  scanner.start(
    {facingMode:'environment'},
    {fps:10,qrbox:{width:250,height:250}},
    onScanSuccess,
    onScanError
  ).catch(err=>{
    showToast('Camera error: '+err,'error');
    stopScanner();
  });
}
function stopScanner() {
  if(scanner){
    scanner.stop().catch(()=>{});
    scanner = null;
  }
  document.getElementById('scannerContainer').style.display = 'none';
  document.getElementById('btnStartScan').classList.remove('hidden');
  document.getElementById('btnStopScan').classList.add('hidden');
}
function onScanSuccess(decodedText) {
  stopScanner();
  const item = inventory.find(i=>i.qr===decodedText || i.id===decodedText);
  if(item){
    showScanResult(item);
  } else {
    showToast('Item not found: '+decodedText,'error');
    setTimeout(()=>startScanner(),2000);
  }
}
function onScanError(err) {}
function toggleFlash() {
  flashOn = !flashOn;
  // Flashlight control would go here - requires advanced camera API
  showToast(flashOn?'Flashlight on':'Flashlight off','success');
}

// ===== SCAN RESULT / TRANSACTION =====
function showScanResult(item) {
  currentItem = item;
  selectedTxType = 'in';
  const result = document.getElementById('scanResult');
  result.classList.remove('hidden');
  result.innerHTML = `
    <div class="item-found-card">
      <div class="item-found-header">
        <h3>✓ Item Found</h3>
        <p>${item.name}</p>
        <p style="font-size:.8rem;color:#6b7280;margin-top:4px;">${item.id} · ${item.cat} · 📍 ${item.loc}</p>
      </div>
      <div class="item-found-stats">
        <div class="item-found-stat"><div class="label">On</div><div class="value" style="color:var(--primary)">${item.onhand}</div></div>
        <div class="item-found-stat"><div class="label">In</div><div class="value" style="color:var(--success)">${item.in}</div></div>
        <div class="item-found-stat"><div class="label">Out</div><div class="value" style="color:var(--danger)">${item.out}</div></div>
        <div class="item-found-stat"><div class="label">MRS</div><div class="value" style="color:var(--warning)">${item.mrs}</div></div>
        <div class="item-found-stat" style="background:#dbeafe"><div class="label">Final</div><div class="value" style="color:#1e40af">${item.final}</div></div>
      </div>
      <div style="margin-bottom:12px">
        <label style="font-size:.8rem;color:#6b7280;font-weight:500">Transaction Type</label>
        <div class="tx-type-selector">
          <div class="tx-type-btn selected" data-type="in" onclick="selectTxType(this,'in')">📥 Stock In</div>
          <div class="tx-type-btn" data-type="out" onclick="selectTxType(this,'out')">📤 Stock Out</div>
          <div class="tx-type-btn" data-type="mrs" onclick="selectTxType(this,'mrs')">🔄 MRS Return</div>
        </div>
      </div>
      <div style="margin-bottom:12px">
        <label style="font-size:.8rem;color:#6b7280;font-weight:500">Quantity</label>
        <div class="qty-stepper">
          <button onclick="changeQty(-1)">−</button>
          <input type="number" id="txQty" value="1" min="1" readonly>
          <button onclick="changeQty(1)">+</button>
        </div>
      </div>
      <div style="margin-bottom:16px">
        <label style="font-size:.8rem;color:#6b7280;font-weight:500">Remarks</label>
        <input type="text" id="txRemarks" placeholder="Optional remarks..." style="width:100%;padding:10px;border:2px solid var(--border);border-radius:10px;margin-top:6px;outline:none;font-size:.9rem">
      </div>
      <button class="btn btn-success" onclick="saveTransaction()">💾 Save Transaction</button>
    </div>
  `;
}
function selectTxType(el, type) {
  selectedTxType = type;
  document.querySelectorAll('.tx-type-btn').forEach(b=>b.classList.remove('selected'));
  el.classList.add('selected');
}
function changeQty(delta) {
  const input = document.getElementById('txQty');
  let v = parseInt(input.value)||0;
  v = Math.max(1, v+delta);
  input.value = v;
}
async function saveTransaction() {
  if(!currentItem) return;
  const qty = parseInt(document.getElementById('txQty').value)||0;
  const remarks = document.getElementById('txRemarks').value.trim();

  if(selectedTxType==='out' && currentItem.final < qty){
    showToast('Insufficient stock! Available: '+currentItem.final,'error');
    return;
  }

  const tx = {
    date: new Date().toLocaleString('en-PH'),
    id: currentItem.id,
    item: currentItem.name,
    type: selectedTxType,
    qty: qty,
    user: currentUser || 'Unknown',
    remarks: remarks
  };

  if(isDemo){
    // Demo mode: update local state
    if(selectedTxType==='in') currentItem.in += qty;
    if(selectedTxType==='out') currentItem.out += qty;
    if(selectedTxType==='mrs') currentItem.mrs += qty;
    currentItem.final = currentItem.onhand + currentItem.in - currentItem.out + currentItem.mrs;
    transactions.push(tx);
    renderInventory();
    renderDashboard();
    renderTransactions();
    showToast('Transaction saved! (Demo)','success');
  } else {
    // Real mode: call API
    try {
      const res = await fetch(CONFIG.api, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({action:'handleTransaction',qr:currentItem.qr,type:selectedTxType,qty:qty,user:currentUser,remarks:remarks})
      });
      const data = await res.json();
      if(data.success){
        transactions.push(tx);
        await loadData();
        showToast('Transaction saved!','success');
      } else {
        showToast(data.message||'Failed to save','error');
      }
    } catch(e) {
      showToast('Network error','error');
      console.error(e);
    }
  }

  // Auto-restart scanner after 2 seconds
  document.getElementById('scanResult').innerHTML = '<div style="text-align:center;padding:20px;color:#6b7280"><div style="font-size:2rem;margin-bottom:8px">✅</div>Transaction saved!<br><small>Auto-restarting scanner...</small></div>';
  setTimeout(()=>{
    document.getElementById('scanResult').classList.add('hidden');
    startScanner();
  }, 2000);
}

// ===== TRANSACTIONS =====
function renderTransactions() {
  const list = document.getElementById('transactionsList');
  if(!transactions.length){
    list.innerHTML = '<div class="card" style="text-align:center;padding:40px;color:#9ca3af">No transactions yet</div>';
    return;
  }
  list.innerHTML = transactions.slice().reverse().map(t=>`
    <div class="card" style="margin-bottom:8px">
      <div class="tx-item" style="border-bottom:none;padding:0">
        <div class="tx-info">
          <div class="tx-title">${t.item||t.id}</div>
          <div class="tx-meta">${t.date} · ${t.user}${t.remarks?' · '+t.remarks:''}</div>
        </div>
        <span class="tx-badge tx-${t.type}">${t.type.toUpperCase()} ${t.qty}</span>
      </div>
    </div>
  `).join('');
}

// ===== TOAST =====
function showToast(msg, type='success') {
  const toast = document.getElementById('toast');
  const icon = document.getElementById('toastIcon');
  const text = document.getElementById('toastMsg');
  toast.className = 'toast ' + type;
  icon.textContent = type==='success'?'✓':'✕';
  text.textContent = msg;
  toast.classList.add('show');
  setTimeout(()=>toast.classList.remove('show'), 3000);
}
</script>
</body>
</html>
